// === Функция: обработка операции ===
function handleOperator(op) {
  const input = parseFloat(numInput.value);
  
  if (!isNaN(input)) {
    // Если у нас уже есть предыдущее значение и операция, выполняем её
    if (previousValue !== null && operation !== null) {
      calculateResult();
    }

    previousValue = input;
    operation = op;

    numInput.value = '';
    
    resultDisplay.textContent = '0';
  } else {
    errorMsg.style.display = 'block';
    errorMsg.textContent = "Пожалуйста, введите число!";
  }
}

// === Функция: выполнение вычисления (с учётом операции) ===
function calculateResult() {
  const input = parseFloat(numInput.value);
  
  if (!isNaN(input)) {
    let result;

    switch (operation) {
      case '+':
        result = previousValue + input;
        break;
      case '-':
        result = previousValue - input;
        break;
      case '*':
        result = previousValue * input;
        break;
      case '/':
        if (input === 0) {
          errorMsg.style.display = 'block';
          errorMsg.textContent = "Ошибка: деление на ноль!";
          return;
        }
        result = previousValue / input;
        break;
      case '%':
        result = previousValue * (input / 100);
        break;
      default:
        return;
    }

    // Обновляем результат
    resultDisplay.textContent = result;

    // Сохраняем в историю
    const historyEntry = {
      operation: operation,
      firstNumber: previousValue,
      secondNumber: input,
      result: result,
      timestamp: new Date().toLocaleString()
    };

    db.ref('history').push(historyEntry);

    // Обновляем предыдущее значение для следующего шага
    previousValue = result;
    operation = null;

    // Очищаем поле ввода и устанавливаем результат как текущий
    numInput.value = '';
  } else {
    errorMsg.style.display = 'block';
    errorMsg.textContent = "Пожалуйста, введите число!";
  }
}

// === Функция: переключение темы (с плавным переходом) ===
function toggleTheme() {
  const body = document.body;
  const themeToggle = document.getElementById('toggleTheme');
  
  if (body.classList.contains('dark-mode')) {
    body.classList.remove('dark-mode');
    themeToggle.textContent = '☀️';
  } else {
    body.classList.add('dark-mode');
    themeToggle.textContent = '🌙';
  }
}

// === Функция: загрузка истории из Firebase при запуске страницы ===
function loadHistory() {
  const historyRef = db.ref('history');
  
  historyRef.on('value', (snapshot) => {
    const entries = snapshot.val();
    
    if (!entries || Object.keys(entries).length === 0) {
      historyList.innerHTML = "Пока нет записей...";
      return;
    }

    // Построчно отображаем историю
    let html = '';
    for (const key in entries) {
      const entry = entries[key];
      
      // Форматируем строку для отображения
      html += `
        <div class="history-item">
          ${entry.firstNumber} ${entry.operation} ${entry.secondNumber} = ${entry.result}
          <span>${entry.timestamp}</span>
        </div>
      `;
    }

    historyList.innerHTML = html;
  });
}

// === Функция: обработка ввода (например, при нажатии на цифры или Enter) ===
document.addEventListener('keydown', function(event) {
  const key = event.key;

  // Проверяем, является ли клавиша цифрой или операцией
  if (/^[0-9]$/.test(key)) {
    numInput.value += key;
  } else if (key === '.') {
    numInput.value += '.';
  } else if (key === '+') {
    handleOperator('+');
  } else if (key === '-') {
    handleOperator('-');
  } else if (key === '*') {
    handleOperator('*');
  } else if (key === '/') {
    handleOperator('/');
  } else if (key === '%') {
    handleOperator('%');
  }
});

// === Инициализация при загрузке страницы ===
document.addEventListener('DOMContentLoaded', () => {
  // Загружаем историю из Firebase
  loadHistory();

  // Устанавливаем слушатели для переключения темы (на панель)
  const themeToggle = document.getElementById('toggleTheme');
  themeToggle.addEventListener('click', toggleTheme);
});
